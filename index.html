<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portfolio</title>
  <meta name="description" content="Portfolio: projects, experience and contact.">
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem('theme'); } catch (e) {}
      if (!t) t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.dataset.theme = t;
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%23ff4d1c'/%3E%3C/svg%3E">
</head>
<body class="is-loading">

  <!-- Preloader -->
  <div class="preloader" aria-hidden="true">
    <div class="preloader__top mono"><span data-bind="name"></span><span>Portfolio &copy;<span data-year></span></span></div>
    <div>
      <div class="preloader__bar"></div>
      <div class="preloader__count">000</div>
    </div>
  </div>

  <!-- Custom cursor -->
  <div class="cursor" aria-hidden="true"><div class="cursor__ring"><i></i></div><div class="cursor__dot"><i></i></div></div>
  <div class="cursor-label" aria-hidden="true"><div class="cursor-label__inner"><span class="cursor-label__text"></span></div></div>

  <div class="progress" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>
  <div class="toast" role="status" aria-live="polite"></div>

  <!-- Header -->
  <header class="header">
    <div class="wrap header__inner">
      <a href="#top" class="logo" data-magnetic="0.25" aria-label="Back to top">
        <span class="logo__mark" data-bind="initials"></span>
        <span class="logo__name"><span class="roll"><span data-bind-roll="name"></span></span></span>
      </a>
      <nav class="nav" aria-label="Primary">
        <a href="#work"><span class="roll"><span data-text="Work">Work</span></span></a>
        <a href="#about"><span class="roll"><span data-text="About">About</span></span></a>
        <a href="#experience"><span class="roll"><span data-text="Experience">Experience</span></span></a>
        <a href="#contact"><span class="roll"><span data-text="Contact">Contact</span></span></a>
      </nav>
      <div class="header__right">
        <span class="clock mono"><span class="clock__place" data-bind="locationShort"></span> <span data-clock>--:--:--</span></span>
        <button class="theme-toggle" type="button" aria-label="Toggle colour theme" data-magnetic="0.4">
          <svg class="icon-sun" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/></svg>
        </button>
        <button class="menu-btn mono" type="button" aria-expanded="false" aria-controls="menu"><span data-menu-label>Menu</span><span class="menu-btn__icon" aria-hidden="true"></span></button>
      </div>
    </div>
  </header>

  <!-- Mobile menu -->
  <div class="menu" id="menu" aria-hidden="true" inert>
    <nav class="menu__nav" aria-label="Mobile">
      <a href="#work" style="--i:0"><span>Work</span></a>
      <a href="#about" style="--i:1"><span>About</span></a>
      <a href="#experience" style="--i:2"><span>Experience</span></a>
      <a href="#contact" style="--i:3"><span>Contact</span></a>
    </nav>
    <div class="menu__foot mono"><span data-bind="email"></span><span data-clock></span></div>
  </div>

  <main>
    <!-- Hero -->
    <section class="hero" id="top">
      <div class="wrap">
        <div class="hero__meta mono">
          <span class="fade-up" style="--d:.5s" data-bind="hero.kicker"></span>
          <span class="fade-up hide-sm" style="--d:.6s" data-bind="hero.course"></span>
          <span class="fade-up" style="--d:.7s"><span class="status"><span class="status__dot"></span><span data-bind="locationShort"></span><span data-clock></span></span></span>
        </div>
        <h1 class="hero__name" id="hero-name">
          <span class="hero__first" id="hero-first" aria-hidden="true"></span>
          <span class="hero__row2">
            <span class="hero__aside fade-up" style="--d:1s" id="hero-aside" aria-hidden="true"></span>
            <span class="hero__last" id="hero-last" aria-hidden="true"></span>
          </span>
        </h1>
        <div class="hero__bottom">
          <p class="hero__intro fade-up" style="--d:.8s" id="hero-intro"></p>
          <dl class="hero__facts fade-up" style="--d:.9s" id="hero-facts"></dl>
          <a href="#work" class="scroll-hint mono fade-up" style="--d:1s" data-magnetic="0.3">
            <span>Scroll</span><span class="scroll-hint__line" aria-hidden="true"></span>
          </a>
        </div>
      </div>
    </section>

    <div class="marquee" aria-label="Skills"></div>

    <!-- Work -->
    <section class="section" id="work">
      <div class="wrap">
        <h2 class="section__title" data-split><span class="line"><span class="line__inner">Selected <em>work</em></span></span></h2>
        <div class="section__head mono" data-reveal><span>(01) Projects</span><span id="work-count"></span></div>
        <ul class="work-list" id="work-list"></ul>
      </div>
    </section>

    <!-- About -->
    <section class="section" id="about">
      <div class="wrap">
        <h2 class="section__title" data-split><span class="line"><span class="line__inner">A little <em>about</em> me</span></span></h2>
        <div class="section__head mono" data-reveal><span>(02) About</span><span data-bind="location"></span></div>
        <div class="about__grid">
          <div class="about__side">
            <div class="portrait" id="portrait" data-reveal></div>
          </div>
          <div class="about__body">
            <p class="statement" id="statement"></p>
            <div id="about-paragraphs"></div>
            <div class="stats" id="stats"></div>
            <div class="skills" id="skills"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Experience -->
    <section class="section" id="experience">
      <div class="wrap">
        <h2 class="section__title" data-split><span class="line"><span class="line__inner">Where I've <em>been</em></span></span></h2>
        <div class="section__head mono" data-reveal><span>(03) Experience</span><span id="resume-link"></span></div>
        <ul class="xp" id="xp-list"></ul>
      </div>
    </section>

    <!-- Contact -->
    <section class="section" id="contact">
      <div class="wrap">
        <p class="mono contact__label" data-reveal>(04) Contact</p>
        <div class="socials" id="socials" data-reveal style="--d:.1s"></div>

        <footer class="footer mono">
          <span>&copy; <span data-year></span> <span data-bind="name"></span></span>
          <span class="hide-sm">Made in <span data-bind="locationShort"></span></span>
          <a href="#top" class="to-top"><span class="roll"><span data-text="Back to top ↑">Back to top ↑</span></span></a>
        </footer>
      </div>
    </section>
  </main>

  <!-- Floating project preview (desktop) -->
  <div class="preview" aria-hidden="true"><div class="preview__inner"><div class="preview__track"></div></div></div>

  <script src="data.js"></script>
  <script src="main.js"></script>
</body>
</html>
